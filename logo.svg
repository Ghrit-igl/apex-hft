<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg_hft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022114"/>
      <stop offset="100%" stop-color="#010c07"/>
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow_hft">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="240" rx="16" fill="url(#bg_hft)" stroke="#065f46" stroke-width="2"/>
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="160" height="160" rx="20" fill="#064e3b" stroke="url(#green-glow)" stroke-width="3" filter="url(#glow_hft)"/>
    <polyline points="30,120 60,95 85,110 130,45" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow_hft)"/>
    <circle cx="130" cy="45" r="8" fill="#6ee7b7"/>
  </g>
  <text x="240" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1.5">
    APEX<tspan fill="#34d399">-HFT</tspan>
  </text>
  <text x="240" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#a7f3d0">
